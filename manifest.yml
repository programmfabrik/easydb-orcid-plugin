plugin:
  name: easydb-orcid-plugin
  version: 1.0
  url: https://github.com/programmfabrik/orcid
  displayname:
    de-DE: Orcid
    en-US: Orcid
  info:
    de-DE: |
      Ermöglicht das Hinterlegen einer ORCID iD im Benutzerkonto und verknüpft so jeden Nutzer mit seinem Forschendenprofil. Damit werden Nutzer mit ihrer dauerhaften Kennung bei [ORCID](https://orcid.org/) verbunden.
    en-US: |
      Lets you store an ORCID iD in a user account, connecting each user to their researcher profile. This links users to their persistent identifier on [ORCID](https://orcid.org/).
  server:
    api-version:
      require: 1
  webfrontend:
    url: easydb-orcid-plugin.js
    l10n: l10n/
